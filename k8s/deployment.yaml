apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
  namespace: notes-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-frontend
  template:
    metadata:
      labels:
        app: portfolio-frontend
      annotations:
        rollout-timestamp: "2026-03-31T18:30:00Z"
    spec:
      containers:
      - name: portfolio-frontend
        image: prathamvish333/portfolio:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
